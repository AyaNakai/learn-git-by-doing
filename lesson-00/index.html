<body>
  <header>
    <h1>Lesson 00：準備と専用ブランチ</h1>
    <p>Git・GitHubアカウント・エディタを準備し、自分の練習場所を作ります。</p>
    <p>エディタでこのファイルを開き、「チュートリアル0-1」から順番に進めてください。<br>2つ目以降の課題の表示用ソースはコメントアウトされています。</p>
  </header>
  <main>
  <!--
    【チュートリアル0-1】準備する
    1. GitHubでこのリポジトリを自分のアカウントへForkしてください。READMEの手順ですでにFork済みなら、そのForkを使います。
    2. 自分のForkのURLで git clone <URL> を実行し、作成されたフォルダへ移動します。すでにclone済みなら、同じフォルダを使います。
    3. git --version と git remote -v でGitとorigin（自分のFork）を確認します。
    4. git config user.name と git config user.email を確認します。未設定なら git config user.name "名前" と git config user.email "メール" で、このリポジトリに設定します。
    5. 完了条件：originが自分のForkを指し、コミット用の名前とメールが設定されている。
  -->
  <section>
    <h2>課題0-1：準備する</h2>
    <p>Gitの練習を始めます。</p>
  </section>
  <!--
    【チュートリアル0-2】専用ブランチを作る
    1. この課題のソースを囲むコメントを解除します。
    2. 以降のコマンド内の yourname は自分の識別名に置き換えます。
    3. git switch -c practice/yourname で専用のマージ先を作ります。
    4. git push -u origin practice/yourname で、専用ブランチをリモートへプッシュします。認証が必要な場合はGitHubの案内に従います。
    5. この課題ではファイルをコミットせず、git restore lesson-00/index.html でコメント解除を取り消します。
    6. 完了条件：未コミットの変更がなく、GitHubに practice/yourname がある。既存コミットを指すブランチなので、空コミットは不要です。
    7. 次のlesson-01から、この専用ブランチで順番に進めます。
  -->
  <!-- 次の課題のソース：この下のコメント開始行と、ソースの後のコメント終了行だけを削除します -->

  </section>
